server:
  port: 8080

spring:
  application:
    name: astrotnt-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/astrotnt
    username: astrotnt
    password: astrotnt
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.springframework: INFO
