name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "resources/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          STATUS="stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-${STATUS}"
          curl -fL --retry 3 -o /tmp/godot.zip "${BASE}/Godot_v${VERSION}-${STATUS}_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "${BASE}/Godot_v${VERSION}-${STATUS}_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${VERSION}-${STATUS}_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.${STATUS}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.${STATUS}/"
          /tmp/godot/Godot_v${VERSION}-${STATUS}_linux.x86_64 --version

      - name: Import project
        shell: bash
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Export Windows release
        shell: bash
        run: |
          mkdir -p build/windows
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/NossoJogo.exe
          test -s build/windows/NossoJogo.exe

      - name: Package tester build
        shell: bash
        run: |
          cd build/windows
          zip -9 -r ../NossoJogo-Windows-x86_64.zip .
          test -s ../NossoJogo-Windows-x86_64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NossoJogo-Windows-x86_64
          path: build/NossoJogo-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
